<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Detalle</h1>

    <main>
        <section>
            <h2>Información del detalle</h2>
            <div id="contenedor-detalle">
                <p>Cargando información del registro...</p>
            </div>
        </section>
    </main>

    <a href="{{ url_for('listado') }}">Volver a Listado</a>
    <br>
    <a href="{{ url_for('index') }}">Volver a Inicio</a>

    <script>
        let miembro_id = new URLSearchParams(window.location.search).get('miembro_id');

        if (!miembro_id) {
            const pathMatch = window.location.pathname.match(/\/detalle\/(\d+)/);
            miembro_id = pathMatch ? pathMatch[1] : null;
        }
    </script>
    <script src="{{ url_for('static', filename='js/detalle.js') }}"></script>
</body>
</html>
