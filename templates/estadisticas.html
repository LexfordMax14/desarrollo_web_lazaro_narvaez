<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas | Actividades DCC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Estadísticas</h1>

    <div class="stats-container">
        <figure class="grafico-figure">
            <div id="container-miembros" class="grafico-container"></div>
            <figcaption class="grafico-descripcion">
                Cantidad de miembros registrados por día.
            </figcaption>
        </figure>

        <figure class="grafico-figure">
            <div id="container-tipos" class="grafico-container"></div>
            <figcaption class="grafico-descripcion">
                Total de actividades extraprogramáticas por tipo.
            </figcaption>
        </figure>

        <figure class="grafico-figure">
            <div id="container-comunas" class="grafico-container"></div>
            <figcaption class="grafico-descripcion">
                Total de actividades registradas por comuna.
            </figcaption>
        </figure>
    </div>

    <p><a href="{{ url_for('index') }}">Volver a la portada</a></p>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
</body>
</html>
