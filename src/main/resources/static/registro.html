<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar miembro — CC5002</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .error { color: #c62828; display: none; font-weight: normal; font-size: 0.9em; }
        .actividad-grupo { background: #f9f9f9; border: 1px solid #d0d0d0; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        #errores-globales { background: #ffebee; border: 1px solid #ef9a9a; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; display: none; }
        #errores-globales ul { margin: 0; padding-left: 20px; }
        #mensaje-exito { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; display: none; color: #2e7d32; }
    </style>
</head>
<body>
<nav>
    <a href="/">Inicio</a> |
    <a href="/registro.html">Registrar</a> |
    <a href="/listado.html">Listado</a> |
    <a href="/estadisticas.html">Estadísticas</a> |
    <a href="/buscador.html">Buscador</a>
</nav>

<h1>Registrar miembro</h1>

<div id="errores-globales"></div>
<div id="mensaje-exito"></div>

<form id="form-registro" enctype="multipart/form-data" novalidate>
    <fieldset>
        <legend>Datos del miembro</legend>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <span class="error" id="error_nombre"></span><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <span class="error" id="error_email"></span><br>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" placeholder="9XXXXXXXX" required>
        <span class="error" id="error_telefono"></span><br>

        <label for="comuna_id">Comuna:</label>
        <select id="comuna_id" name="comunaId" required>
            <option value="">Cargando comunas...</option>
        </select>
        <span class="error" id="error_comuna_id"></span><br>
    </fieldset>

    <div id="contenedor-actividades"></div>

    <button type="button" onclick="agregarActividad()">+ Agregar actividad</button>
    <br><br>
    <button type="submit" id="btn-registrar">Registrar</button>
</form>

<script src="/js/actividades.js"></script>
<script src="/js/validaciones.js"></script>
<script src="/js/registro.js"></script>
</body>
</html>
